[tox]
min_version = 4.0
envlist = black, py{38,39,310,311,312,313}-test

[testenv]
package = wheel
deps =
    -rrequirements.txt
    py38: -c{toxinidir}/constraints/py38.txt
    py311: -c{toxinidir}/constraints/py311.txt
    py313: -c{toxinidir}/constraints/py313.txt
commands = pytest --ignore=tests/test_windows_auth.py {posargs}

[testenv:black]
basepython = python3.8
deps = black
skip_install = true
commands = black "{toxinidir}"

[testenv:docs]
basepython = python3.13
skip_install = true
commands = python tox_hook.py docs

[testenv:sync-project]
basepython = python3.13
skip_install = true
passenv = *
commands = python tox_hook.py sync-project

[testenv:sync-composapy]
basepython = python3.13
skip_install = true
passenv = *
commands = python tox_hook.py sync-composapy

[testenv:windows-auth]
basepython = python3.13
deps =
    -rrequirements.txt
    -c{toxinidir}/constraints/py313.txt
commands = pytest tests/test_windows_auth.py {posargs}
