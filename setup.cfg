[metadata]
name = composapy
version = 1.0.0
author = Composable
author_email = support@composableanalytics.com
description = ComposableAnalytics csharp binding for python
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/ComposableAnalytics/Composapy
project_urls =
    Bug Tracker = https://github.com/ComposableAnalytics/Composapy/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = .
packages = find:
python_requires = >=3.8

[options.extras_require]
deps = 
    numpy
    pandas<3
    papermill
    json-fix
    requests
    requests-negotiate-sspi; sys_platform == "win32"

[options.packages.find]
where = .
exclude =
    tests
    tests.*

[options.package_data]
* = static/*
composapy._wire = operations.json